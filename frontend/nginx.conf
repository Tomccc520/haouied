server {
    listen 80;
    server_name hao.uied.cn;  # 替换为您的域名

    root /var/www/html;  # 替换为您的React应用构建目录路径
    index index.html;

    # 配置缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 可索引详情路由必须存在对应预渲染文件，否则返回真实 404，避免软 404。
    location ~ ^/(?:website|article|articles|category|categories|tag|tags|mcp)/ {
        try_files $uri/index.html $uri =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }

    # 已知 SPA 路由继续交给 React，未知路径返回真实 404 页面。
    location ~ ^/(?:home|uiux|ai|design|3d|ecommerce|interior|font|category|categories|p|tag|tags|site|website|vs|mcp|figma|articles|article|search|profile|submit|changelog|hot|rankings|daily-hot|daily-new|install|auth)(?:/|$) {
        try_files $uri/index.html $uri /index.html;
    }

    location / {
        try_files $uri/index.html $uri /404/index.html =404;
    }

    # 搜索页面特殊处理 - 确保直接访问也能正常工作
    location = /search {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 优化配置
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
