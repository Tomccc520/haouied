    <script>
    /**
     * 启动阶段动态同步后台站点 SEO，避免构建时写死的 meta 长期滞后。
     * 说明：此方案依赖浏览器执行 JS，搜索引擎最终收录仍受抓取策略影响。
     */
    (function() {
      var DEFAULT_SEO = {
        siteName: 'UIED AI工具导航',
        siteTitle: 'UIED AI工具导航 - 精选AI工具与资源平台',
        siteDescription: 'UIED AI导航汇集全球优质AI工具与资源，帮助设计师、开发者与创作者高效发现并使用 AI 工具。',
        siteKeywords: 'UIED,UIED AI导航,AI导航,AI工具,AI工具导航,人工智能工具'
      };

      function upsertMeta(type, key, content) {
        if (!content) return;
        var selector = type === 'property' ? 'meta[property="' + key + '"]' : 'meta[name="' + key + '"]';
        var node = document.head.querySelector(selector);
        if (!node) {
          node = document.createElement('meta');
          node.setAttribute(type, key);
          document.head.appendChild(node);
        }
        node.setAttribute('content', content);
      }

      function upsertCanonical(url) {
        if (!url) return;
        var node = document.head.querySelector('link[rel="canonical"]');
        if (!node) {
          node = document.createElement('link');
          node.setAttribute('rel', 'canonical');
          document.head.appendChild(node);
        }
        node.setAttribute('href', url);
      }

      function normalizeSeo(payload) {
        var source = payload && typeof payload === 'object' ? payload : {};
        var siteName = String(source.siteName || source.site_name || DEFAULT_SEO.siteName).trim() || DEFAULT_SEO.siteName;
        var siteTitle = String(source.siteTitle || source.site_title || siteName).trim() || siteName;
        var siteDescription = String(
          source.siteDescription || source.site_description || source.description || DEFAULT_SEO.siteDescription
        ).trim() || DEFAULT_SEO.siteDescription;
        var siteKeywords = String(
          source.siteKeywords || source.site_keywords || source.keywords || DEFAULT_SEO.siteKeywords
        ).trim() || DEFAULT_SEO.siteKeywords;
        return {
          siteName: siteName,
          siteTitle: siteTitle,
          siteDescription: siteDescription,
          siteKeywords: siteKeywords
        };
      }

      function updateWebsiteJsonLd(siteOrigin, seo) {
        var scripts = document.head.querySelectorAll('script[type="application/ld+json"]');
        if (!scripts || !scripts.length) return;
        var origin = String(siteOrigin || '').trim();
        if (!origin) return;
        for (var i = 0; i < scripts.length; i += 1) {
          var node = scripts[i];
          if (!node || !node.textContent) continue;
          try {
            var data = JSON.parse(node.textContent);
            if (!data || String(data['@type'] || '').toLowerCase() !== 'website') continue;
            data.name = seo.siteName;
            data.description = seo.siteDescription;
            data.url = origin;
            if (data.potentialAction && typeof data.potentialAction === 'object') {
              data.potentialAction.target = origin + '/search?q={search_term_string}';
            }
            if (data.publisher && typeof data.publisher === 'object') {
              data.publisher.url = origin;
            }
            node.textContent = JSON.stringify(data, null, 2);
          } catch (error) {
            // JSON-LD 解析失败时忽略，避免影响页面渲染
          }
        }
      }

      function applySeo(seo) {
        var resolved = normalizeSeo(seo);
        var pathname = String(window.location.pathname || '/');
        var siteOrigin = String(window.location.origin || '').replace(/\/+$/, '');
        var homeUrl = siteOrigin + '/';
        var isHomeRoute = pathname === '/' || pathname === '/home';
        upsertMeta('property', 'og:site_name', resolved.siteName);
        updateWebsiteJsonLd(siteOrigin, resolved);

        /**
         * 非首页不在启动脚本中写 title/description/canonical，
         * 避免与页面级 SEO 组件发生覆盖竞态。
         */
        if (!isHomeRoute) return;
        document.title = resolved.siteTitle;
        upsertMeta('name', 'description', resolved.siteDescription);
        upsertMeta('name', 'keywords', resolved.siteKeywords);
        upsertMeta('property', 'og:title', resolved.siteTitle);
        upsertMeta('property', 'og:description', resolved.siteDescription);
        upsertMeta('property', 'og:url', homeUrl);
        upsertMeta('name', 'twitter:title', resolved.siteTitle);
        upsertMeta('name', 'twitter:description', resolved.siteDescription);
        upsertMeta('name', 'twitter:url', homeUrl);
        upsertCanonical(homeUrl);
      }

      function applyWebmasterVerification(config) {
        var source = config && typeof config === 'object' ? config : {};
        var map = [
          { field: 'baidu', name: 'baidu-site-verification' },
          { field: 'google', name: 'google-site-verification' },
          { field: 'bing', name: 'msvalidate.01' },
          { field: 'sogou', name: 'sogou_site_verification' },
          { field: 'so360', name: '360-site-verification' }
        ];
        map.forEach(function(item) {
          var code = String(source[item.field] || '').trim();
          if (!code) return;
          upsertMeta('name', item.name, code);
        });
      }

      function fetchJson(url) {
        return fetch(url, { cache: 'no-store' })
          .then(function(response) {
            if (!response || !response.ok) return null;
            return response.json();
          })
          .catch(function() {
            return null;
          });
      }

      Promise.all([
        fetchJson('/api/site-info?_t=' + Date.now()),
        fetchJson('/api/seo/public-config?_t=' + Date.now())
      ])
        .then(function(results) {
          var siteInfoPayload = results && results[0];
          var seoConfigPayload = results && results[1];

          if (siteInfoPayload) {
            var siteData = siteInfoPayload && typeof siteInfoPayload === 'object' && siteInfoPayload.data
              ? siteInfoPayload.data
              : siteInfoPayload;
            applySeo(siteData);
          }

          if (seoConfigPayload) {
            var seoData = seoConfigPayload && typeof seoConfigPayload === 'object' && seoConfigPayload.data
              ? seoConfigPayload.data
              : seoConfigPayload;
            applyWebmasterVerification(seoData && seoData.webmasterVerification);
          }
        });
    })();
    </script>
