version: "3.8"

services:
  uied-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_IMAGE: "${UIED_NODE_IMAGE:-node:20-bookworm-slim}"
        NPM_REGISTRY: "${UIED_NPM_REGISTRY:-https://registry.npmjs.org}"
    image: "uied-nav-api:${UIED_VERSION:-1.1.4}"
    container_name: "${UIED_CONTAINER_NAME:-uied-api}"
    restart: unless-stopped
    init: true
    network_mode: bridge
    env_file:
      - "${UIED_API_ENV_FILE:-./uied-api.env}"
    environment:
      NODE_ENV: production
      EGG_SERVER_ENV: prod
      UIED_UPLOADS_ABS_DIR: /data/uploads
    ports:
      - "127.0.0.1:${UIED_API_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:${UIED_DOCKER_HOST_GATEWAY:-host-gateway}"
    volumes:
      - "${UIED_UPLOADS_HOST_DIR:-./data/uploads}:/data/uploads"
      - "${UIED_LICENSES_HOST_DIR:-./data/licenses}:/app/licenses"
      - "${UIED_LOGS_HOST_DIR:-./data/logs}:/app/logs"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8002/api/uied/license/public-status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
