# UIED-NAV 可选 MySQL + Redis 容器
# 仅用于没有宝塔 MySQL/Redis 的独立部署，所有密码都必须通过环境变量提供。

services:
  mysql:
    image: "mysql:${UIED_MYSQL_VERSION:-8.0}"
    container_name: uied-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UIED_MYSQL_HOST_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${UIED_MYSQL_ROOT_PASSWORD:?请配置 UIED_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${UIED_MYSQL_DATABASE:-uied_nav}"
      MYSQL_USER: "${UIED_MYSQL_USER:-uied}"
      MYSQL_PASSWORD: "${UIED_MYSQL_PASSWORD:?请配置 UIED_MYSQL_PASSWORD}"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: "redis:${UIED_REDIS_VERSION:-7-alpine}"
    container_name: uied-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UIED_REDIS_HOST_PORT:-6380}:6379"
    environment:
      UIED_REDIS_PASSWORD: "${UIED_REDIS_PASSWORD:?请配置 UIED_REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$UIED_REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$UIED_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: uied_mysql_data
  redis_data:
    name: uied_redis_data
